name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo SDK compatibility
        run: npx --yes expo-doctor

      - name: Static security and UI checks
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Erro: .env não pode ser versionado no repositório."
            exit 1
          fi
          if grep -rn "service_role" src/; then
            echo "Erro: chave service_role detectada em src/."
            exit 1
          fi
          if grep -rnE --exclude="FeedbackProvider.tsx" "Alert\.alert|window\.alert|window\.confirm" src/; then
            echo "Erro: uso direto de Alert/window.alert/confirm fora do FeedbackProvider."
            exit 1
          fi
          if grep -rnE "(^|[^A-Za-z0-9_])(RF|RNF)[0-9]+" src/; then
            echo "Erro: código interno RF/RNF encontrado em src/."
            exit 1
          fi
          if grep -rnE "fontSize:[[:space:]]*([1-9]|1[0-2])([^0-9]|$)" src/; then
            echo "Erro: fontSize menor que 13px encontrado em src/."
            exit 1
          fi

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --ci --no-cache

      - name: Verify Expo Web and iOS bundles
        run: |
          set -euo pipefail
          npx expo export --platform web --output-dir /tmp/expo-web-check
          npx expo export --platform ios --output-dir /tmp/expo-ios-check
          rm -rf /tmp/expo-web-check /tmp/expo-ios-check
